name: MergePilot Dogfood

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-secret:
    # Never pass provider secrets to forked pull requests.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      provider: ${{ steps.check.outputs.provider }}
    steps:
      - name: Check selected provider credentials
        id: check
        shell: bash
        env:
          AI_PROVIDER: ${{ vars.MERGEPILOT_AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.MERGEPILOT_NVIDIA_MODEL || 'qwen/qwen2.5-coder-32b-instruct' }}
        run: |
          case "$AI_PROVIDER" in
            gemini)
              if [[ -n "$GEMINI_API_KEY" ]]; then
                echo "configured=true" >> "$GITHUB_OUTPUT"
              else
                echo "configured=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Set GEMINI_API_KEY secret or select NVIDIA with MERGEPILOT_AI_PROVIDER."
              fi
              ;;
            nvidia)
              echo "provider=nvidia" >> "$GITHUB_OUTPUT"
              if [[ -n "$NVIDIA_API_KEY" && -n "$NVIDIA_MODEL" ]]; then
                echo "configured=true" >> "$GITHUB_OUTPUT"
              else
                echo "configured=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Set NVIDIA_API_KEY secret and MERGEPILOT_NVIDIA_MODEL variable."
              fi
              ;;
            *)
              echo "::error::Unsupported MERGEPILOT_AI_PROVIDER: $AI_PROVIDER"
              exit 1
              ;;
          esac
          echo "provider=$AI_PROVIDER" >> "$GITHUB_OUTPUT"

  review:
    needs: check-secret
    if: needs.check-secret.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Run MergePilot against the pull request
        uses: ./
        with:
          ai-provider: ${{ needs.check-secret.outputs.provider }}
          ai-api-key: ${{ needs.check-secret.outputs.provider == 'nvidia' && secrets.NVIDIA_API_KEY || secrets.GEMINI_API_KEY }}
          ai-model: ${{ needs.check-secret.outputs.provider == 'nvidia' && (vars.MERGEPILOT_NVIDIA_MODEL || 'qwen/qwen2.5-coder-32b-instruct') || vars.MERGEPILOT_GEMINI_MODEL || 'gemini-3.8-flash' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target-branches: develop
